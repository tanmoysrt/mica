[package]
name = "mica"
version = "0.2.0"
edition = "2024"
description = "Block devices whose data lives in an S3 bucket"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
console = "0.16.6"
crc32fast = "1.5.0"
env_logger = "0.11.11"
futures = "0.3.34"
hex = "0.4.3"
indicatif = "0.18.6"
io-uring = "0.7"
libc = "0.2.189"
libublk = "0.4.8"
log = "0.4.34"
object_store = { version = "0.14.2", features = ["aws"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
smol = "2.0.2"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
zstd = "0.13.3"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
# A panic stops the daemon. The devices stay paused, and the next start
# takes them over: better than a live daemon with a dead queue thread.
panic = "abort"
debug = 1
