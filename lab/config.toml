# mica lab daemon. Separate from the main mica service: its own socket,
# data folder and bucket prefix. The CLI uses it with
# `--config lab/config.toml` (the socket is root:mica 0660).
socket = "/run/mica-lab.sock"
data_dir = "/var/lib/mica-lab"
cache_limit_gib = 150
dirty_limit_gib = 40
checkpoint_interval_secs = 30
checkpoint_after_mib = 512
max_unsaved_minutes = 5
wait_when_behind = false
mount_roots = ["/mnt/mica-lab"]
gc_keep_checkpoints = 5
gc_grace_hours = 24
memory_high = ""

[s3]
endpoint = "http://172.31.99.10:9000"
bucket = "mica-lab"
access_key_id = "micalab"
secret_access_key = "micalab-secret"
region = "us-east-1"
prefix = "v3"
conditional_writes = true
