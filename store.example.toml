# The bucket of a disk. Give it to each command with `--store <file>`, or set
# S3_ENDPOINT, S3_BUCKET, S3_PREFIX, S3_REGION, S3_ACCESS_KEY_ID and
# S3_SECRET_ACCESS_KEY. Keep the file private: chmod 600.

endpoint = "https://<account>.r2.cloudflarestorage.com"
bucket = "my-disks"
# All disks of this file go under this prefix.
prefix = "laptop"
region = "auto"
access_key_id = "..."
secret_access_key = "..."
