# The bucket of a disk. mica reads /etc/mica/store.toml, or the file of
# `--store <file>`. A flag such as --bucket, or a variable such as
# OBJECT_STORAGE_BUCKET, overrides the value of the file.
# Keep the file private: chmod 600.

endpoint = "https://<account>.r2.cloudflarestorage.com"
bucket = "my-disks"
# All disks of this file go under this prefix.
prefix = "laptop"
region = "auto"
access_key_id = "..."
secret_access_key = "..."
