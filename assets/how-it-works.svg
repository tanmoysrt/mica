<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How mica works</title>
  <desc id="desc">A program on a machine uses /dev/mica/data. The mica daemon keeps the newest writes and a cache on the local SSD, and uploads the changes to an S3 bucket every 5 minutes. Another machine attaches the disk and downloads only the data that it reads.</desc>
  <style>
    .panel { fill: #f6f8fa; stroke: #d0d7de; }
    .box { fill: #ffffff; stroke: #d0d7de; }
    .accent { fill: #0057ff; }
    .bucket { fill: #eaf2ff; stroke: #0057ff; }
    .title { fill: #1f2328; font-size: 15px; font-weight: 600; }
    .text { fill: #1f2328; font-size: 14px; }
    .small { fill: #59636e; font-size: 12.5px; }
    .light { fill: #ffffff; font-size: 14px; font-weight: 600; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; fill: #1f2328; }
    .line { stroke: #59636e; stroke-width: 1.6; fill: none; }
    .flow { stroke: #0057ff; stroke-width: 1.8; fill: none; }
    .head { fill: #59636e; }
    .headblue { fill: #0057ff; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="head"/></marker>
    <marker id="arrowblue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" class="headblue"/></marker>
  </defs>

  <rect x="16" y="16" width="548" height="212" rx="14" class="panel"/>
  <text x="36" y="44" class="title">Your machine</text>

  <rect x="36" y="64" width="128" height="58" rx="9" class="box"/>
  <text x="100" y="89" text-anchor="middle" class="text">App, VM or</text>
  <text x="100" y="108" text-anchor="middle" class="text">database</text>

  <rect x="196" y="64" width="160" height="58" rx="9" class="box"/>
  <text x="276" y="98" text-anchor="middle" class="mono">/dev/mica/data</text>

  <rect x="388" y="64" width="152" height="58" rx="9" class="accent"/>
  <text x="464" y="98" text-anchor="middle" class="light">mica daemon</text>

  <path d="M164 93 H190" class="line" marker-end="url(#arrow)"/>
  <path d="M356 93 H382" class="line" marker-end="url(#arrow)"/>
  <path d="M464 122 V150" class="line" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect x="372" y="156" width="184" height="56" rx="9" class="box"/>
  <text x="464" y="179" text-anchor="middle" class="text">Local SSD</text>
  <text x="464" y="198" text-anchor="middle" class="small">newest writes and a cache</text>

  <text x="36" y="166" class="text">Most reads and writes stay</text>
  <text x="36" y="186" class="text">on the local SSD.</text>

  <path d="M640 52 C640 38 836 38 836 52 V196 C836 210 640 210 640 196 Z" class="bucket"/>
  <path d="M640 52 C640 66 836 66 836 52" class="bucket"/>
  <text x="738" y="104" text-anchor="middle" class="title">S3 bucket</text>
  <text x="738" y="128" text-anchor="middle" class="small">the whole disk,</text>
  <text x="738" y="146" text-anchor="middle" class="small">its versions and snapshots</text>

  <path d="M540 80 H632" class="flow" marker-end="url(#arrowblue)"/>
  <text x="602" y="72" text-anchor="middle" class="small">changes,</text>
  <text x="602" y="100" text-anchor="middle" class="small">every 5 min</text>
  <path d="M632 118 H540" class="line" marker-end="url(#arrow)"/>
  <text x="602" y="136" text-anchor="middle" class="small">missing data</text>

  <rect x="16" y="252" width="548" height="72" rx="14" class="panel"/>
  <text x="36" y="282" class="title">Another machine</text>
  <text x="36" y="306" class="text">Attach the disk there. It starts at once, and downloads only what it reads.</text>
  <path d="M738 210 V288 H570" class="line" marker-end="url(#arrow)"/>
</svg>
